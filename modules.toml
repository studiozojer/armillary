# armillary — composition manifest
#
# the armillary is a minimal, agent-agnostic router. it composes the modules declared here.
# clone each module into the `path` shown to assemble a working workspace. NOTHING here is
# required — a bare router runs with no modules at all.
#
# this file is the PUBLIC SCHEMA + examples. your actual composition (private repo URLs,
# per-machine paths) belongs in a gitignored `modules.local.toml` or in `CLAUDE.local.md`,
# so the published router stays agnostic to who occupies it.

[router]
# the minimal core that IS this repo — always present, never a module.
# `.gitignore`'s allowlist mirrors this set; the two had drifted (it re-included
# getting-started.md and philosophy.md, which this list did not name) and were
# reconciled 2026-07-29 in favor of the gitignore, which was the correct side.
contains = ["CLAUDE.md", "README.md", "self.md", "modules.toml", "LICENSE", "getting-started.md", "philosophy.md"]

# `boot` names the router's OWN boot file — read at instance creation and injected
# as a session's system prompt. One file, relative to this root. Distinct from a
# module-contributed `[[protocols]]` entry with `load = "boot"`: those carry
# `requires`, a load timing, and sometimes a companion data file, none of which
# the router's own file has. Absent means no boot event and no system prompt —
# presence-gated like everything else here.
#
# Prefer a DECLARATIVE file. `CLAUDE.md` is written as instructions to a reader
# with filesystem access ("read modules.toml", "load self.md before responding");
# injected into a session with no read tools, it invites a model to confabulate
# having followed them. State facts instead.
# boot = "getting-started.md"

# ── operators ────────────────────────────────────────────────────────────────
# an operator is a composed identity (its files, graph, protocols) — distinct from
# the model (the engine piloting it in a session). each operator is its own git
# repo, composed under `operators/`. the router routes to whichever are present;
# declare your own. (legacy section names [[agents]]/[[models]] are still parsed —
# a manifest declaring `path = "models/<name>"` still composes, because the path is
# read from the manifest. the `models -> operators` compat SYMLINK is retired as of
# 2026-07-28: a bare `models/...` path in prose no longer resolves.)

# [[operators]]
# name = "<operator>"
# path = "operators/<operator>"
# repo = "<your-operator-repo>"  # keep private URLs out of the public manifest
# note = "what this operator is for"

# ── commons ─────────────────────────────────────────────────────────────────
# your way of working — wikis, a board, practices — as a SINGLE repo dropped in at
# commons/ and gitignored. workspace-scoped, not universal: bring your own, or clone
# the template commons to start from (see README).

# [[commons]]
# name = "commons"
# path = "commons"
# repo = "<your-commons-repo>"
# note = "wikis, board, practices, collaborative space"

# ── code / project repos ────────────────────────────────────────────────────
# product or project repos your agents act on. each its own git repo.

# [[repos]]
# name = "<repo>"
# path = "repos/<repo>"
# repo = "<your-repo>"

# ── protocols ────────────────────────────────────────────────────────────────
# the disciplines the dispatcher loads. a protocol is a "how to do X" doc that any
# composed module brings — an agent, the commons, a repo. declare it here with a
# load-timing and the router composes it into the session at the right moment.
# DECLARATIVE: the router knows a protocol exists because this file names it (it does
# NOT scan), so the manifest stays legible — what loads, and when, in one place.
#
#   load = "boot"         read at session start; shapes the session from the start
#   load = "on-demand"    a pointer; the body is read only when `when` matches the work
#   load = "session-end"  runs at close — best-effort (a clean session close isn't promised)

# [[protocols]]
# name   = "board"
# source = "commons/practices/board/practice.md"
# load   = "boot"

# [[protocols]]
# name   = "session-metrics"
# source = "commons/practices/session-metrics/practice.md"
# load   = "session-end"

# [[protocols]]
# name   = "athanor"
# source = "commons/athanor/briefing.md"
# load   = "on-demand"
# when   = "the user wants to resume or work in the athanor"
